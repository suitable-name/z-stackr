[package]
name = "z-stackr-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Desktop focus-stacking app built with Slint: add frames, align, stack with Apex, Relief or Strata, retouch from the source frames and export."
build = "build.rs"

[lib]
# Keep the crate identifier `stacker_gui` so source `use` paths are unchanged.
# The binary is named `z-stackr-gui` (the package name) automatically.
name = "stacker_gui"

[dependencies]
z-stackr-core = { workspace = true }
z-stackr-align = { workspace = true }
z-stackr-algo = { workspace = true }
z-stackr-pipeline = { workspace = true }
# AI stacking is opt-in: without `--features nn` the GUI builds with zero ML deps.
z-stackr-nn = { workspace = true, optional = true, default-features = false, features = [
    "ndarray",
] }
rayon = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
toml = { workspace = true }
# `Instant` / `SystemTime` that work in the browser (std's panic on wasm32); on the
# desktop these are std's own types.
web-time = { workspace = true }

# Desktop only: native dialogs, folder watching, the per-user config folder, and the
# winit accessors (drop filter, monitor size) the desktop wiring uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slint = { workspace = true, features = ["unstable-winit-030"] }
rfd = { workspace = true }
directories = { workspace = true }
notify = { workspace = true }
# The `ui-harness` feature's seams (file dialogs, data directory): see tests/ui.rs.
slint-harness-hooks = { workspace = true, optional = true }

# The browser build: Slint on winit with the femtovg renderer, drawing on a canvas.
# Not inherited from the workspace, which keeps Slint's default features (a member's
# `default-features = false` cannot switch them off there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
] }

[target.'cfg(all(not(target_os = "windows"), not(target_arch = "wasm32")))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { workspace = true }

[features]
# AKAZE feature matching is an *optional accelerator* that seeds the
# intensity-based aligner. It is on by default but the GUI builds and aligns
# correctly with `--no-default-features` (pure intensity registration).
default = ["akaze"]
akaze = ["z-stackr-align/akaze", "z-stackr-pipeline/akaze"]
# `Apex` on the GPU (wgpu) when Compute device is GPU in the settings; the CPU
# stays the fallback. Independent of `nn-gpu`, which is the AI mode's backend.
gpu = ["z-stackr-pipeline/gpu"]
# AI ("neural") stacking mode on the CPU (ndarray) backend.
nn = ["dep:z-stackr-nn", "z-stackr-pipeline/nn"]
# Camera RAW files as source frames (native only; the pipeline ignores it on wasm32).
raw = ["z-stackr-pipeline/raw"]
# Adds the wgpu/Vulkan GPU backend to the AI mode (implies `nn`).
nn-gpu = ["nn", "z-stackr-nn/wgpu"]
# The headless UI harness (`cargo test -p z-stackr-gui --features ui-harness --test ui`):
# native file dialogs answer from the harness's queue and the config folder moves into its
# throw-away profile. Desktop only.
ui-harness = ["dep:slint-harness-hooks"]

[build-dependencies]
slint-build = { workspace = true }
winresource = { workspace = true }

[dev-dependencies]
# Headless Slint backend for the UI flow tests (`src/ui_flow_tests`). Pinned to
# the exact slint version, as slint itself is.
i-slint-backend-testing = "=1.18.1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
slint-harness = { workspace = true }

# The slint-harness UI test owns `main` (panic recorder, exit code, scenario filter) and
# needs the `ui-harness` seams, so it is built only with that feature.
[[test]]
name = "ui"
harness = false
required-features = ["ui-harness"]

[lints]
workspace = true
