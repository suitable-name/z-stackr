[package]
name = "z-stackr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Keep the crate identifier `stacker_cli` so source `use` paths are unchanged.
name = "stacker_cli"

[[bin]]
name = "z-stackr"
path = "src/main.rs"

[dependencies]
toml = { workspace = true }
z-stackr-core = { workspace = true }
z-stackr-align = { workspace = true }
z-stackr-algo = { workspace = true }
z-stackr-pipeline = { workspace = true }
# Neural-network stacking is opt-in: without `--features nn` the CLI builds with
# zero ML / Burn dependencies.
z-stackr-nn = { workspace = true, optional = true, default-features = false, features = [
    "ndarray",
] }
clap = { workspace = true }
tracing = { workspace = true }
notify = { workspace = true }
indicatif = { workspace = true }

[build-dependencies]
winresource = { workspace = true }

[dev-dependencies]
# Only the test modules decode and encode images directly.
image = { workspace = true }

[features]
default = []
akaze = ["z-stackr-align/akaze", "z-stackr-pipeline/akaze"]
# Alignment, `Apex` and `Relief` on the GPU (wgpu) when `compute_device = "gpu"` in the settings; the CPU
# stays the fallback. Independent of `nn-gpu`, which is the AI mode's backend.
gpu = ["z-stackr-pipeline/gpu"]
# AI ("neural") stacking mode and neural alignment on the CPU (ndarray) backend.
nn = ["dep:z-stackr-nn", "z-stackr-pipeline/nn"]
# RAW camera files (DNG, CR2, NEF, ...) as input frames; native only.
raw = ["z-stackr-pipeline/raw"]
# Adds the wgpu/Vulkan GPU backend to the AI mode (implies `nn`).
nn-gpu = ["nn", "z-stackr-nn/wgpu"]

[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { workspace = true }

[lints]
workspace = true
