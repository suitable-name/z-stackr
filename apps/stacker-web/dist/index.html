<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>z-stackr</title>
    <!--
      Tab icon. Trunk's `rel="icon"` copies the file (content-hashed) and rewrites the
      link; the SVG is copied unhashed under its own name for browsers that prefer it.
      Both are generated by `scripts/make-icons.py`.
    -->
    <link rel="icon" href="/favicon-d9fe0954873f4670.png"/>
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!--
      No CSS/JS of this page's own beyond this reset: Slint's `renderer-femtovg` backend
      drives everything inside the `<canvas>` below. Trunk rewrites the `data-trunk` link
      into a `<script type="module">` that loads the built `.wasm`/`.js` pair and runs the
      `#[wasm_bindgen(start)]` entry point of `z-stackr-web` automatically.
    -->
    <style>
      html, body {
        margin: 0;
        height: 100%;
        /*
          Scroll instead of clipping when the window is smaller than the app's
          minimum size (MIN_WINDOW_* in `src/viewport.rs`), so nothing is unreachable.
        */
        overflow: auto;
        background: #1b1b1f;
      }
      /*
        Sized in CSS, not in width/height attributes: Slint reads this element's
        client size to derive the window's preferred size and writes the backing-store
        size itself. CSS is what lets the responsive layout see the viewport.
      */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        /* Keep in step with MIN_WINDOW_WIDTH / MIN_WINDOW_HEIGHT in `src/viewport.rs`. */
        min-width: 1120px;
        min-height: 700px;
        outline: none;
      }
    </style>
  <link rel="modulepreload" href="/z-stackr-web-c43f98e98cb234d7.js" crossorigin="anonymous"><link rel="preload" href="/z-stackr-web-c43f98e98cb234d7_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm"></head>
  <body>
    <!--
      `id="canvas"` is REQUIRED: Slint's winit backend binds its renderer to exactly
      `document.getElementById("canvas")`. Without it the app paints into an element that
      is not in the DOM and the page shows only the background colour.
    -->
    <canvas id="canvas"></canvas>
    <noscript>
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;font:16px sans-serif;color:#f1f5f9;background:#1b1b1f;">
        z-stackr needs JavaScript and WebAssembly. Enable JavaScript or try a current
        Chrome, Edge, Firefox or Safari.
      </div>
    </noscript>
    <!--
      Profiles. `data-cargo-profile-dev="stacker-web-dev"`: an optimised dev profile (see
      the workspace `Cargo.toml`), because debug wasm stacks far too slowly to use.
      `data-cargo-profile-release="stacker-web-release"` is the same for
      `trunk build --release`. Both `<link>`s name them so the shared dependencies compile
      once.

      wasm-opt (release builds only): level `s` on the page, `3` on the worker, with the
      wasm features rustc emits enabled explicitly. If a release build ever fails inside
      wasm-opt, set `data-wasm-opt="0"` on the failing `<link>` and report the message.
    -->
    
<script type="module">
import init, * as bindings from '/z-stackr-web-c43f98e98cb234d7.js';
const wasm = await init({ module_or_path: '/z-stackr-web-c43f98e98cb234d7_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <!--
      The Web Worker that runs the stacking pipeline. Trunk builds `apps/stacker-web-worker`
      with wasm-bindgen's `no-modules` target, adds no script tag for it, and writes
      `z-stackr-web-worker.js`, `z-stackr-web-worker_bg.wasm` and (from `data-loader-shim`)
      `z-stackr-web-worker_loader.js` to `dist/`, named after the package and never
      content-hashed. The page starts the worker from that loader (`LOADER_URL` in
      `src/worker.rs` must match its name).
    -->
    
  </body>
</html>
