[package]
name = "z-stackr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Core types of z-stackr: planar linear-light images, sRGB conversion, the settings schema and a file-backed tile store."

[lib]
# Keep the crate identifier `stacker_core` so source `use` paths are unchanged
# even though the published package is `z-stackr-core`.
name = "stacker_core"

[dependencies]
image = { workspace = true }
bytemuck = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde = { workspace = true }
toml = { workspace = true }
# EXIF copy-through (`metadata`): pure Rust, also built for wasm32.
kamadak-exif = "0.6.1"
img-parts = "0.4.0"

# RAW input (`raw` feature, `io`): native only, never built for wasm32. The version is the
# one the GitHub release pins.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rawler = { version = "=0.7.2", optional = true }

[features]
default = []
# Camera RAW decoding through `rawler` (desktop and command line; ignored on wasm32).
raw = ["dep:rawler"]

[lints]
workspace = true
