[package]
name = "z-stackr-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Keep the crate identifier `stacker_pipeline` (the package is `z-stackr-pipeline`).
name = "stacker_pipeline"

[dependencies]
z-stackr-core = { workspace = true }
z-stackr-align = { workspace = true }
z-stackr-algo = { workspace = true }
z-stackr-gpu = { workspace = true, optional = true }
image = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }

# The alignment networks run native only (burn is not built for wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
z-stackr-nn = { workspace = true, optional = true }

[features]
default = []
# AKAZE feature matching seeds the intensity-based aligner (see `align::Seeder`).
akaze = ["z-stackr-align/akaze"]
# `Apex` on the GPU through wgpu (see `compute::Compute`); the CPU stays the
# fallback. Off by default: the CPU crates never need a GPU stack.
gpu = ["dep:z-stackr-gpu"]
# Camera RAW input (`load::decode_frame` reads `.cr2`, `.nef`, `.dng`, ...); native only, no
# effect on wasm32.
raw = ["z-stackr-core/raw"]
# Neural alignment (`alignment_mode = "neural"`, see `align::AlignModel`); native only. Pulls
# the CPU backend of the networks; an app that wants the GPU adds `z-stackr-nn/wgpu` itself.
nn = ["dep:z-stackr-nn", "z-stackr-nn/ndarray"]

# CPU against GPU on real frames; needs the device.
[[example]]
name = "gpu_profile"
required-features = ["gpu"]

[[example]]
name = "align_stack"
required-features = ["gpu"]

[lints]
workspace = true
