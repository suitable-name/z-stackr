[package]
name = "z-stackr-nn"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neural-network pairwise merge crate for z-stackr focus-stacking (Burn backend)"

[lib]
# Keep the crate identifier `stacker_nn` so source `use` paths are unchanged.
name = "stacker_nn"

# ---------------------------------------------------------------------------
# Feature matrix
#
#   ndarray  – pure-Rust CPU backend; the default verification backend.
#   wgpu     – Vulkan-based GPU backend for AMD / Intel / NVIDIA inference.
#   autodiff – wraps the selected backend for backprop (default).
#
# At least one of {ndarray, wgpu} must be active (the crate refuses to compile
# otherwise). Both may be on at once (the GUI's `nn-gpu` does this to offer a
# CPU/GPU choice at runtime); the training/scalar backend alias then resolves
# by priority wgpu > ndarray.
#
# Notes:
# * `burn/std` is required for `burn::optim` (AdamW) and the file recorders, so
#   it is folded into each backend feature.
# * There is intentionally NO `train` feature: in burn 0.16.1 the `burn-train`
#   crate fails to compile unless its own `metrics` feature is also on, and we
#   don't use its `Learner` anyway — the trainer is hand-rolled on `burn::optim`,
#   which `burn/std` already provides. So the training binary builds under the
#   default features.
# * There is no `cuda` feature (dropped 2026-10-01): it had no inference device
#   and never compiled.
# ---------------------------------------------------------------------------
[features]
# `autodiff` is in the default set on purpose, so the autodiff-backed backward
# pass of the model + loss and the recurrent rollout in `train.rs` are reachable
# under the default build.
default = ["ndarray", "autodiff", "eval"]
ndarray = ["burn/ndarray", "burn/std"]
wgpu = ["burn/wgpu", "burn/std"]
autodiff = ["burn/autodiff"]
# The `stacker-nn-eval` binary (inference side of `scripts/04_eval_alignment.py`)
# runs the classical refiner after the network, so it needs the aligner. The apps
# depend on this crate with `default-features = false` and never see it.
eval = ["dep:z-stackr-align"]

# ---------------------------------------------------------------------------
# Training driver — its own binary. It only needs the autodiff backend (which is
# in the default set). To train on the GPU (wgpu) instead of the default CPU
# backend, build with
#   cargo run -p z-stackr-nn --release --no-default-features \
#       --features "wgpu,autodiff" --bin z-stackr-train -- <args>
# ---------------------------------------------------------------------------
[[bin]]
name = "z-stackr-train"
path = "src/bin/train.rs"
required-features = ["autodiff"]

# ---------------------------------------------------------------------------
# Alignment evaluation — the binary `scripts/04_eval_alignment.py` shells out to
# (JSON request on stdin, JSON response on stdout) and a direct scene evaluator.
#   cargo build -p z-stackr-nn --release --bin stacker-nn-eval
# ---------------------------------------------------------------------------
[[bin]]
name = "stacker-nn-eval"
path = "src/bin/eval.rs"
required-features = ["eval"]

[dependencies]
# Burn – we declare a single dependency and gate backends via its own features.
# Pinned to the 0.16 series (the record formats below depend on it).
burn = { workspace = true }

# Pipeline image type (PlanarImage) — needed by the planar<->tensor bridge and
# by the integration tests in `tests/`.
z-stackr-core = { workspace = true }

# Pixel-space matrices of the alignment networks (`nalgebra::Matrix3<f32>`, the type
# `stacker_align::Matrix3` re-exports).
nalgebra = { workspace = true }

# Classical refinement after the network, for `stacker-nn-eval` only (`eval` feature).
z-stackr-align = { workspace = true, optional = true }

# Data / I/O
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
