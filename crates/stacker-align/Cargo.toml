[package]
name = "z-stackr-align"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Frame alignment for focus stacking: Lucas-Kanade and Nelder-Mead registration (shift, scale, rotation, affine), brightness correction and AKAZE + RANSAC seeding."

[lib]
name = "stacker_align"

[dependencies]
z-stackr-core = { workspace = true }
akaze = { workspace = true, optional = true }
bitarray = { workspace = true, optional = true }
nalgebra = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }

[features]
default = []
akaze = ["dep:akaze", "dep:bitarray"]

[lints]
workspace = true
