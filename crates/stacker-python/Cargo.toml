[package]
name = "z-stackr-python"
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://z-stackr.suitable-na.me"
repository = "https://github.com/suitable-name/z-stackr"
description = "Python bindings for the z-stackr focus-stacking engine (out-of-core file pipeline and in-RAM numpy path)"
# Not published to crates.io: this crate ships to end users as a Python wheel built by
# `maturin` (see `pyproject.toml` and the README), never as a Rust dependency of another crate.
publish = false

# This crate is NOT a member of the main workspace (the root `Cargo.toml` lists it under
# `exclude`), so `cargo test --workspace --all-features` never links libpython. It has its own
# workspace root, its own `Cargo.lock` and its own `target` directory. Build and check it with
# `--manifest-path crates/stacker-python/Cargo.toml` (or from inside this directory).
[workspace]
resolver = "3"

[lib]
# The Rust crate identifier. The Python import name (`zstackr`) is set by `#[pymodule]` and by
# `[tool.maturin] module-name` in `pyproject.toml`.
name = "stacker_python"
crate-type = ["cdylib", "rlib"]

[features]
# Nothing is on by default: the pure-Rust parts (settings mirror, pixel converters, progress
# mapping, the stacking flows) build and test without Python. maturin adds `python` and
# `extension-module` (see `pyproject.toml`).
default = []
# The PyO3 / numpy bindings themselves.
python = ["dep:pyo3", "dep:numpy"]
# Link as an extension module instead of against libpython. maturin enables it; leave it off for
# `cargo test --features python`, which links libpython directly.
extension-module = ["pyo3/extension-module", "pyo3/generate-import-lib"]
# Pure forwards to the features of `z-stackr-pipeline`.
#
# `gpu`: the GPU kernels for alignment, `Apex`, `Relief` and `Strata` (settings key
# `compute_device = "gpu"`); the CPU stays the fallback.
gpu = ["z-stackr-pipeline/gpu"]
# `raw`: camera RAW input for `stack_files`, `batch_stack` and `load_image`.
raw = ["z-stackr-pipeline/raw"]
# `akaze`: AKAZE seeding of the alignment (settings key `akaze_seeding`).
akaze = ["z-stackr-pipeline/akaze"]
# `nn`: reserved. The Python API does not select a neural model yet, so with
# `alignment_mode = "Neural"` the pipeline falls back to `Registration` with a warning.
nn = ["z-stackr-pipeline/nn"]

[dependencies]
pyo3 = { version = "0.29.0", optional = true }
numpy = { version = "0.29.0", optional = true }
z-stackr-core = { path = "../stacker-core" }
z-stackr-align = { path = "../stacker-align" }
z-stackr-algo = { path = "../stacker-algo" }
z-stackr-pipeline = { path = "../stacker-pipeline" }
# The same version as the rest of the workspace (`akaze` pins it).
image = "0.23.14"
rayon = "1.12"
toml = "1.1.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
