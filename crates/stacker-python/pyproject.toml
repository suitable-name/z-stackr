[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
# The PyPI name differs from the import name: `pip install z-stackr`, `import zstackr`.
name = "z-stackr"
version = "1.0.0"
description = "Python bindings for z-stackr, a focus-stacking engine written in Rust (import name: zstackr)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "numpy>=2.5.1",
]

[tool.maturin]
# A plain `maturin build` / `maturin develop` builds the bindings only. `gpu`, `raw`, `akaze` are
# opt-in, for example `maturin build --release --features gpu,raw`.
features = ["python", "extension-module"]
# The import name (`import zstackr`), independent of the PyPI name above and of the Cargo
# `[lib] name` (`stacker_python`).
module-name = "zstackr"
